<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14151a">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}Desk Mate{% endblock %}</title>
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% if session.logged_in %}
  <nav class="topnav">
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('cards') }}">Cards</a>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <button type="submit" class="link-btn">Log out</button>
    </form>
  </nav>
  {% endif %}

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-stack" id="flash-stack">
      {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    <script>
      setTimeout(() => {
        const el = document.getElementById('flash-stack');
        if (el) el.classList.add('flash-fade');
      }, 2500);
    </script>
    {% endif %}
  {% endwith %}

  <main class="{% block mainclass %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
